name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-seo:
    name: Documentation, build, package, essentials, and SEO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mcp
      - run: npm run test:mcp
      - run: npm run test:docs
      - run: npm run build
      - run: node tests/check-imports.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:package
      - run: npm run test:essentials
      - run: npx playwright test tests/seo.spec.mjs
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: artifacts/
          retention-days: 7
