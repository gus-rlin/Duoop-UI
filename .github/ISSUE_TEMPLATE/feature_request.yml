name: Feature request
description: Suggest a component, variant, or improvement.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include interaction, keyboard, and mobile expectations where relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and references
      description: Existing components, examples, or sketches that explain the idea.
